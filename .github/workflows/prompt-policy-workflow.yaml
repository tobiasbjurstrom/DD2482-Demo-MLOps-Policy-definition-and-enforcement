name: LLM Policy Gate

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'promptfooconfig.yaml'
  push:
    branches:
      - main
    paths:
      - 'prompts/**'
      - 'promptfooconfig.yaml'
  workflow_dispatch:

jobs:
  policy-eval:
    name: Promptfoo Security & Regression Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache npm global cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          # Pin to a specific promptfoo version to make the cache key predictable
          key: ${{ runner.os }}-promptfoo-${{ hashFiles('**/promptfooconfig.*') }}-0.100.0
          restore-keys: |
            ${{ runner.os }}-promptfoo-

      - name: Install Promptfoo
        run: npm install -g promptfoo@latest

      - name: Run Policy Evaluations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          promptfoo eval --no-cache --no-progress-bar
